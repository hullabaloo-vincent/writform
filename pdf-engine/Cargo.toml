# The PDF engine the app edits PDFs with (see NOTICE.md for where it came from).
#
# A workspace of its own, outside the app's: it is built to WebAssembly by
# apps/desktop/tools/build-pdf-engine.mjs and the result is committed, so an ordinary build of
# the app never compiles it.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/VAliquo/writform"

[workspace.dependencies]
wfpdf-filters = { path = "crates/filters" }
wfpdf-crypt = { path = "crates/crypt" }
wfpdf-cos = { path = "crates/cos" }
wfpdf-content = { path = "crates/content" }
wfpdf-model = { path = "crates/model" }
wfpdf-fonts = { path = "crates/fonts" }
wfpdf-organize = { path = "crates/organize" }
wfpdf-annot = { path = "crates/annot" }
wfpdf-forms = { path = "crates/forms" }
wfpdf-edit = { path = "crates/edit" }

flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
thiserror = "2"
kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# testing
proptest = "1"
weezl = "0.2"
hayro-syntax = "0.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Small before fast: this is downloaded when a PDF is first opened.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
