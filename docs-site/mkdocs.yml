# subScribe documentation.
# The SAME markdown pages render inside the app (Docs icon in the dock) and
# build into this static site:  pip install mkdocs-material && mkdocs serve
site_name: subScribe
site_description: A writing suite you own. Documents, books, PDFs, boards and notes on your device, and a self-hosted server for writing together.
repo_url: https://github.com/hullabaloo-vincent/writform
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Setup: setup.md
  - Features: features.md
  - How-to: how-to.md
  - Plugins: plugins.md
  - Endpoints: endpoints.md
  - Networking: networking.md
